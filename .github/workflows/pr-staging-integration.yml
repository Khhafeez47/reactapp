name: Linear Commit Tracking

on:
  pull_request:
    types: [closed]
    branches:
      - staging

jobs:
  track-commits:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get merged commit hash
        id: get-hash
        run: |
          MERGE_COMMIT_HASH=${{ github.event.pull_request.merge_commit_sha }}
          echo "MERGE_COMMIT_HASH=$MERGE_COMMIT_HASH" >> $GITHUB_ENV

      - name: Extract Linear issue IDs from PR title and body
        id: get-issues
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"

          ISSUES=$(echo "$PR_TITLE $PR_BODY" | grep -o -E '[A-Z]+-[0-9]+' | sort -u)

          if [ -z "$ISSUES" ]; then
            echo "No Linear issue IDs found"
            exit 1
          fi

          ISSUES_JSON=$(echo "$ISSUES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "ISSUES=$ISSUES_JSON" >> $GITHUB_ENV

      - name: Update Linear issues with commit hash and set state
        uses: actions/github-script@v6
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUES: ${{ env.ISSUES }}
          COMMIT_HASH: ${{ env.MERGE_COMMIT_HASH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          STAGING_STATE_ID: ${{ secrets.LINEAR_STAGING_STATE_ID }}
        with:
          script: |
            const axios = require('axios');
            const issues = JSON.parse(process.env.ISSUES);
            const commitHash = process.env.COMMIT_HASH;
            const prNumber = process.env.PR_NUMBER;
            const prUrl = process.env.PR_URL;
            const stagingStateId = process.env.STAGING_STATE_ID;

            for (const identifier of issues) {
              try {
                const query = `
                  query GetIssue($identifier: String!) {
                    issues(filter: { identifier: { eq: $identifier } }) {
                      nodes { id }
                    }
                  }
                `;
                const res = await axios.post('https://api.linear.app/graphql', {
                  query,
                  variables: { identifier }
                }, { headers: { Authorization: process.env.LINEAR_API_KEY, 'Content-Type': 'application/json' } });

                const nodes = res.data.data.issues.nodes;
                if (!nodes.length) {
                  console.log(\`Issue \${identifier} not found\`);
                  continue;
                }
                const issueId = nodes[0].id;

                // Update issue state
                await axios.post('https://api.linear.app/graphql', {
                  query: `
                    mutation UpdateIssue($id: String!, $stateId: String!) {
                      issueUpdate(id: $id, input: { stateId: $stateId }) {
                        success
                      }
                    }
                  `,
                  variables: { id: issueId, stateId: stagingStateId }
                }, { headers: { Authorization: process.env.LINEAR_API_KEY, 'Content-Type': 'application/json' } });

                // Add comment with commit hash & PR link
                const commentBody = \`Merged to staging via PR #\${prNumber}.\nCommit: \\\`\${commitHash}\\\`\nPR Link: \${prUrl}\nReady for QA verification.\`;

                await axios.post('https://api.linear.app/graphql', {
                  query: `
                    mutation CreateComment($issueId: String!, $body: String!) {
                      commentCreate(input: { issueId: $issueId, body: $body }) {
                        success
                      }
                    }
                  `,
                  variables: { issueId, body: commentBody }
                }, { headers: { Authorization: process.env.LINEAR_API_KEY, 'Content-Type': 'application/json' } });

                console.log(\`Updated issue \${identifier}\`);
              } catch (error) {
                console.error(\`Failed updating issue \${identifier}: \`, error.message);
              }
            }

