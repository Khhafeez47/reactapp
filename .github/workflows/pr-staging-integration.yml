name: Linear Commit Tracking

on:
  pull_request:
    types: [closed]
    branches:
      - staging

jobs:
  track-commits:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get merged commit hash
        id: get-hash
        run: |
          MERGE_COMMIT_HASH=${{ github.event.pull_request.merge_commit_sha }}
          echo "MERGE_COMMIT_HASH=$MERGE_COMMIT_HASH" >> $GITHUB_ENV
          echo "Short hash: ${MERGE_COMMIT_HASH:0:8}"

      - name: Get Linear issue IDs from branch name, PR title or description
        id: get-issue-ids
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"

          # Extract Linear issue IDs (e.g., ENG-255) from all sources
          ISSUES=$(echo "$PR_TITLE $PR_BODY $BRANCH_NAME" | grep -o -E '[A-Z]+-[0-9]+' | sort -u)

          if [ -z "$ISSUES" ]; then
            echo "No Linear issue IDs found in PR title, body, or branch name"
            exit 1
          fi

          ISSUES_JSON=$(echo "$ISSUES" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "ISSUE_IDS=$ISSUES_JSON" >> $GITHUB_ENV
          echo "Found issues: $ISSUES_JSON"

      - name: Update Linear issues with commit hash
        uses: actions/github-script@v6
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ISSUES: ${{ env.ISSUE_IDS }}
          COMMIT_HASH: ${{ env.MERGE_COMMIT_HASH }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        with:
          script: |
            const axios = require('axios');

            const issues = JSON.parse(process.env.ISSUES);
            const commitHash = process.env.COMMIT_HASH;
            const prNumber = process.env.PR_NUMBER;
            const prUrl = process.env.PR_URL;

            console.log(`Updating Linear issues: ${issues.join(', ')}`);

            for (const issueId of issues) {
              try {
                const getResponse = await axios({
                  method: 'post',
                  url: 'https://api.linear.app/graphql',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': process.env.LINEAR_API_KEY
                  },
                  data: JSON.stringify({
                    query: `
                      query GetIssue($id: String!) {
                        issue(id: $id) {
                          id
                          identifier
                          state {
                            id
                            name
                          }
                        }
                      }
                    `,
                    variables: {
                      id: issueId
                    }
                  })
                });

                const issue = getResponse.data.data.issue;
                if (!issue) {
                  console.log(`Issue ${issueId} not found`);
                  continue;
                }

                // Replace with actual state ID for "In Staging"
                const stagingStateId = "YOUR_IN_STAGING_STATE_ID";

                const updateResponse = await axios({
                  method: 'post',
                  url: 'https://api.linear.app/graphql',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': process.env.LINEAR_API_KEY
                  },
                  data: JSON.stringify({
                    query: `
                      mutation UpdateIssue($id: String!, $stateId: String!, $comment: String!) {
                        issueUpdate(
                          id: $id,
                          input: {
                            stateId: $stateId
                          }
                        ) {
                          success
                        }
                        commentCreate(
                          input: {
                            issueId: $id,
                            body: $comment
                          }
                        ) {
                          success
                        }
                      }
                    `,
                    variables: {
                      id: issue.id,
                      stateId: stagingStateId,
                      comment: `Merged to staging via PR #${prNumber}.\nCommit: \`${commitHash}\`\nPR: ${prUrl}\n\nReady for QA verification.`
                    }
                  })
                });

                if (updateResponse.data.data.issueUpdate.success) {
                  console.log(`Successfully updated issue ${issue.identifier}`);
                } else {
                  console.error(`Failed to update issue ${issue.identifier}`);
                }

              } catch (error) {
                console.error(`Error updating issue ${issueId}:`, error.message);
                core.setFailed(`Error updating Linear: ${error.message}`);
              }
            }
