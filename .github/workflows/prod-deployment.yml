name: Release Verification and Prod Deployment

on:
  pull_request:
    types: [opened, synchronize, closed]
    branches:
      - main
    paths:
      - 'RELEASE_NOTES.md'

jobs:
  verify-release:
    if: github.event.pull_request.merged == false && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Parse release notes
        id: parse-notes
        run: |
          VERSION=$(head -n 1 RELEASE_NOTES.md | sed 's/# Release //')
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Run verification tests
        run: |
          echo "Running verification tests for release $RELEASE_VERSION"
          # Insert your actual test commands here

      - name: Security scans
        run: |
          echo "Running security scans for release $RELEASE_VERSION"
          # Insert your security scanning commands here

      - name: Update PR with verification status
        uses: actions/github-script@v6
        if: success()
        with:
          script: |
            const { repo, owner } = context.repo;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: `## Release Verification Complete

              All tests and scans passed for release ${process.env.RELEASE_VERSION}.

              This release is ready for production deployment. Please approve the PR.`
            });

            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number: context.issue.number,
              name: 'needs-verification'
            });

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: context.issue.number,
              labels: ['verified']
            });

  deploy-to-production:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'verified')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Parse release version
        run: |
          VERSION=$(head -n 1 RELEASE_NOTES.md | sed 's/# Release //')
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Deploy to production
        run: |
          echo "Deploying release $RELEASE_VERSION"
          # Add your deployment commands here

      - name: Tag release
        run: |
          git config user.name "Release Bot"
          git config user.email "release-bot@example.com"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION"
          git push origin "$RELEASE_VERSION"

      - name: Update Linear issues to Released state and add comments
        uses: actions/github-script@v6
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          RELEASED_STATE_ID: ${{ secrets.LINEAR_RELEASED_STATE_ID }}
        with:
          script: |
            const axios = require('axios');
            const fs = require('fs');
            const releaseNotes = fs.readFileSync('RELEASE_NOTES.md', 'utf8');

            // Extract issue IDs from release notes, assumes "- ABC-123" format lines
            const identifiers = Array.from(releaseNotes.matchAll(/^- (\w+-\d+)/gm)).map(m => m[1]);
            console.log('Issues in release:', identifiers.join(', '));

            for (const identifier of identifiers) {
              try {
                // Get issue ID
                const getRes = await axios.post('https://api.linear.app/graphql', {
                  query: `
                    query GetIssue($identifier: String!) {
                      issues(filter: { identifier: { eq: $identifier } }) {
                        nodes { id }
                      }
                    }
                  `,
                  variables: { identifier }
                }, {
                  headers: { Authorization: process.env.LINEAR_API_KEY, 'Content-Type': 'application/json' }
                });

                const nodes = getRes.data.data.issues.nodes;
                if (!nodes.length) {
                  console.log(`Issue ${identifier} not found`);
                  continue;
                }
                const issueId = nodes[0].id;

                // Update issue state to Released
                await axios.post('https://api.linear.app/graphql', {
                  query: `
                    mutation UpdateIssue($id: String!, $stateId: String!) {
                      issueUpdate(id: $id, input: { stateId: $stateId }) {
                        success
                      }
                    }
                  `,
                  variables: { id: issueId, stateId: process.env.RELEASED_STATE_ID }
                }, {
                  headers: { Authorization: process.env.LINEAR_API_KEY, 'Content-Type': 'application/json' }
                });

                // Add comment marking deployment
                const commentBody = \` Deployed to production with release \\\`${process.env.RELEASE_VERSION}\\\`.\`;

                await axios.post('https://api.linear.app/graphql', {
                  query: `
                    mutation CreateComment($issueId: String!, $body: String!) {
                      commentCreate(input: { issueId: $issueId, body: $body }) {
                        success
                      }
                    }
                  `,
                  variables: { issueId, body: commentBody }
                }, {
                  headers: { Authorization: process.env.LINEAR_API_KEY, 'Content-Type': 'application/json' }
                });

                console.log(`Updated issue ${identifier} to Released state.`);
              } catch (error) {
                console.error(`Error updating issue ${identifier}:`, error.message);
              }
            }

      - name: Notify Slack channel
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: 'releases'
          slack-message: |
            🚀 Release ${{ env.RELEASE_VERSION }} deployed to production.
            Check release notes and deployment status.
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}