name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g., v1.2.3)'
        required: true
      release_name:
        description: 'Release name'
        required: true
      skip_features:
        description: 'Linear IDs to exclude from release (comma-separated)'
        required: false
        default: ''
  repository_dispatch:
    types: [slack_release_approval]

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Git user
        run: |
          git config user.name "Release Bot"
          git config user.email "release-bot@example.com"

      - name: Query Linear for QA-approved release candidate issues
        id: linear-query
        uses: actions/github-script@v6
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SKIP_FEATURES: ${{ github.event.inputs.skip_features || github.event.client_payload.skip_features || '' }}
        with:
          script: |
            const axios = require('axios');
            const skipFeatures = process.env.SKIP_FEATURES ? process.env.SKIP_FEATURES.split(',').map(s => s.trim()) : [];

            const response = await axios.post('https://api.linear.app/graphql', {
              query: `
                query {
                  issues(
                    filter: {
                      state: { name: { eq: "QA Approved" } }
                    }
                  ) {
                    nodes {
                      id
                      identifier
                      title
                      description
                      customFields {
                        name
                        value
                      }
                      relations {
                        nodes {
                          type
                          relatedIssue {
                            identifier
                            state { name }
                          }
                        }
                      }
                      creator { name }
                      comments {
                        nodes {
                          body
                        }
                      }
                    }
                  }
                }
              `
            }, {
              headers: {
                Authorization: process.env.LINEAR_API_KEY,
                'Content-Type': 'application/json'
              }
            });

            const allIssues = response.data.data.issues.nodes;

            // Filter out skipped features
            const filteredBySkip = allIssues.filter(issue => !skipFeatures.includes(issue.identifier));

            // Filter out not ready for release
            const readyIssues = filteredBySkip.filter(issue => {
              const readyField = issue.customFields.find(cf => cf.name === 'Ready For Release');
              return !readyField || readyField.value !== 'false';
            });

            // Filter dependencies - all dependencies must be QA Approved
            const validIssues = readyIssues.filter(issue => {
              const dependenciesField = issue.customFields.find(cf => cf.name === 'Dependencies');
              if (!dependenciesField || !dependenciesField.value) return true;
              const deps = issue.relations.nodes.filter(r => r.type === 'depends on');
              return deps.every(dep => dep.relatedIssue.state.name === 'QA Approved');
            });

            // Extract commit hash from comments
            const issuesWithCommit = validIssues.map(issue => {
              let commitHash = null;
              for (const comment of issue.comments.nodes) {
                const match = comment.body.match(/Commit:\s*`([a-f0-9]+)`/i);
                if (match) {
                  commitHash = match[1];
                  break;
                }
              }
              return { 
                id: issue.id,
                identifier: issue.identifier,
                title: issue.title,
                commitHash,
                creator: issue.creator?.name || 'Unknown'
              };
            }).filter(issue => issue.commitHash);

            if (issuesWithCommit.length === 0) {
              core.setFailed('No release-ready issues with commit hashes found');
              return;
            }

            core.setOutput('issues', JSON.stringify(issuesWithCommit));
            core.exportVariable('APPROVED_ISSUES', JSON.stringify(issuesWithCommit));
            core.exportVariable('ISSUES_FOR_DISPLAY', JSON.stringify(
              issuesWithCommit.map(i => ({ identifier: i.identifier, title: i.title, creator: i.creator }))
            ));

      - name: Prepare release info
        id: prepare-release
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version || github.event.client_payload.release_version }}
          RELEASE_NAME: ${{ github.event.inputs.release_name || github.event.client_payload.release_name }}
        run: |
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV

      - name: Create release branch and cherry-pick commits
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          APPROVED_ISSUES: ${{ env.APPROVED_ISSUES }}
        run: |
          git checkout main
          BRANCH="release/${RELEASE_VERSION}"
          git checkout -b $BRANCH
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV

          TEMP=$(mktemp)
          echo "# Release ${RELEASE_VERSION}" > $TEMP
          echo "" >> $TEMP
          echo "## Included Changes" >> $TEMP
          echo "" >> $TEMP

          SUCCESS=true
          APPLIED=()
          FAILED=()

          echo "$APPROVED_ISSUES" | jq -c '.[]' | while read -r issue; do
            ID=$(echo "$issue" | jq -r '.identifier')
            HASH=$(echo "$issue" | jq -r '.commitHash')
            TITLE=$(echo "$issue" | jq -r '.title')
            echo "Applying $ID - $TITLE ($HASH)"
            if git cherry-pick "$HASH"; then
              echo "- $ID: $TITLE" >> $TEMP
              APPLIED+=("$ID")
              echo "Applied $ID"
            else
              echo "Failed $ID"
              FAILED+=("$ID")
              git cherry-pick --abort
              SUCCESS=false
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "" >> $TEMP
            echo "## Conflicts detected" >> $TEMP
            for f in "${FAILED[@]}"; do
              echo "- $f" >> $TEMP
            done
            echo "**Manual resolution required before release can proceed.**" >> $TEMP
          fi

          cp $TEMP RELEASE_NOTES.md
          git add RELEASE_NOTES.md
          git commit -m "Add release notes for ${RELEASE_VERSION}"

          git push origin $BRANCH

          if [ "$SUCCESS" = false ]; then
            echo "CONFLICTS_DETECTED=true" >> $GITHUB_ENV
          else
            echo "CONFLICTS_DETECTED=false" >> $GITHUB_ENV
          fi

          RELEASE_NOTES_CONTENT=$(cat $TEMP)
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$RELEASE_NOTES_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send Slack approval message
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: 'releases'
          slack-message: |
            *Release ${RELEASE_VERSION}* created with ${APPROVED_ISSUES.length} issues.
            Please review and approve via Slack.
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

          #Test