version: 0.0
os: linux
files:
  - source: /
    destination: /opt/application/sample-reactapp
hooks:
  ApplicationStop:
    - location: scripts/stop.sh
      timeout: 300
      runas: root
  BeforeInstall:
    - location: scripts/beforeinstall.sh
      timeout: 300
      runas: root
  Install:
    - location: scripts/afterinstall.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start.sh
      timeout: 300
      runas: root
